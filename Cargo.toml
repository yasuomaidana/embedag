[workspace]
members = [
    "crates/embedag-core",
    "crates/embedag-derive",
    "crates/embedag-llm",
    "crates/embedag-diesel",
    "crates/embedag-rag",
    "crates/embedag-oxirs",
    "crates/embedag-surrealdb",
    "crates/embedag-neo4j",
    "crates/embedag-matcher",
    "crates/embedag",
    "crates/embedag-example-receipts",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yasuomaidana/embedag"
homepage = "https://github.com/yasuomaidana/embedag"

[workspace.dependencies]
# Internal crates
embedag = { path = "crates/embedag", version = "0.1.1" }
embedag-core = { path = "crates/embedag-core", version = "0.1.1" }
embedag-derive = { path = "crates/embedag-derive", version = "0.1.1" }
embedag-llm = { path = "crates/embedag-llm", version = "0.1.1" }
embedag-diesel = { path = "crates/embedag-diesel", version = "0.1.1" }
embedag-rag = { path = "crates/embedag-rag", version = "0.1.1" }
embedag-oxirs = { path = "crates/embedag-oxirs", version = "0.1.1" }
embedag-surrealdb = { path = "crates/embedag-surrealdb", version = "0.1.1" }
embedag-neo4j = { path = "crates/embedag-neo4j", version = "0.1.1" }
embedag-matcher = { path = "crates/embedag-matcher", version = "0.1.1" }
diesel-libsql = { version = "0.1.4", default-features = false }

# Core domain
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
petgraph = { version = "0.8", default-features = false, features = ["std", "graphmap", "stable_graph"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
h3o = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }

# LLM & Schema
schemars = { version = "1", features = ["derive", "chrono04"] }
gbnf = "0.2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
candle-core = { version = "0.11", default-features = false }
oxillama = { version = "0.1.4", default-features = false }
oxirag = "0.1.1"
oxirs-core = "0.4.1"

# Native Graph & Multi-Model Backends
surrealdb = { version = "4", default-features = false, features = ["kv-mem", "protocol-ws", "rustls"] }
neo4rs = { version = "0.9.0-rc.11" }

# Relational Persistence
diesel = { version = "2.3", features = ["postgres_backend", "sqlite", "returning_clauses_for_sqlite_3_35", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "tokio-postgres", "deadpool", "sync-connection-wrapper"] }
diesel-cte-ext = { version = "0.3", default-features = false }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1", "with-chrono-0_4"] }
#TODO: UPDATE TO LATEST WE NEED TO UPDATE OTHER DEPENDENCIES
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
pgvector = { version = "0.4.2", features = ["diesel", "postgres"] }
libsql = { version = "0.10" }

# Procedural macros
syn = { version = "3.0.9", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

# Concurrency & Utility
parking_lot = "0.13.0"

# Testing
proptest = "1.12.0"
rstest = "0.28.0"
jsonschema = "0.61"
tempfile = "3.27.0"
testcontainers = "0.28.0"
testcontainers-modules = { version = "0.15", features = ["postgres", "surrealdb", "neo4j"] }

[workspace.metadata.release]
# Keep all workspace crates at the same version
shared-version = true

# Create a single unified Git tag instead of 10 individual tags
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"

# Git commit message for version bumps
pre-release-commit-message = "chore: release v{{version}}"

# Automatically push commit and tags to origin
push = true
publish = true
