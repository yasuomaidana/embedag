name: Rust CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: Code Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt --all --check

  quality:
    name: Quality gates (production lines, repeated code, rstest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache loom-gate
        id: loom-gate-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/loom-gate
          key: loom-gate-${{ runner.os }}-develop-v1

      - name: Install loom-gate
        if: steps.loom-gate-cache.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: ""
        run: cargo install --locked --git https://github.com/yasuomaidana/dendrite-rag-rs --branch develop loom-gate

      - name: No file over its production-line limit
        run: loom-gate loc --format github

      - name: No repeated code
        run: loom-gate clones --format github

      - name: Tests use the rstest crate
        run: loom-gate rstest --format github

  lint:
    name: Linter & Static Analysis (clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  complexity:
    name: Code Complexity & Cognitive Metrics (rust-code-analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust-code-analysis-cli
        run: cargo install rust-code-analysis-cli --locked

      - name: Analyze Cyclomatic & Cognitive Complexity
        run: |
          mkdir -p metrics-out
          rust-code-analysis-cli --metrics -p crates -I "*.rs" -O json -o metrics-out
          echo "### Code Complexity Metrics Summary" >> $GITHUB_STEP_SUMMARY
          echo "$(find metrics-out -name '*.json' | wc -l) source files analysed" >> $GITHUB_STEP_SUMMARY

      - name: Upload Complexity Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: complexity-metrics
          path: metrics-out

  test-matrix:
    name: Build & Test Matrix (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install libpq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "LIBRARY_PATH=$(brew --prefix libpq)/lib" >> "$GITHUB_ENV"
          echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> "$GITHUB_ENV"

      - name: Run unit & integration tests
        run: cargo test --all-targets --all-features --verbose

      - name: Run documentation tests
        run: cargo test --doc

  persistence-testcontainers:
    name: Mandatory Persistence Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker Daemon Availability for Testcontainers
        run: |
          docker version
          docker info

      - name: Run Mandatory Persistence Integration Tests via Testcontainers
        run: cargo test --all-targets --all-features --verbose

  coverage:
    name: Code Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Generate Code Coverage Report (LCOV & Summary)
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov --all-features --workspace --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: lcov.info

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  audit-security:
    name: Security Vulnerability & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Security Audit
        run: cargo audit

  semver-check:
    name: SemVer & API Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Check Semantic Versioning Compatibility
        run: cargo semver-checks check-release --verbose || echo "Initial release or baseline not published yet; semver check passed advisory mode."
