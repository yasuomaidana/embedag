name: audit ignores

# Fails when an advisory ignored in .cargo/audit.toml no longer applies, so the list only shrinks (issue #2).
# Runs on every pull request: no branch or path filter, so no change reaches main unchecked.
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  stale-ignores:
    name: No stale audit ignores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Check the ignore list
        run: bash scripts/check-audit-ignores.sh
