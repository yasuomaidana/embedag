[package]
name = "embedag"
description = "Deterministic hybrid Graph-RAG, in-memory DAGs, mixed-modality encoding and relational persistence."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["full"]
full = ["core", "derive", "llm", "diesel", "rag", "oxirs-tdb"]
core = ["dep:embedag-core"]
derive = ["dep:embedag-derive"]
llm = ["dep:embedag-llm"]
diesel = ["dep:embedag-diesel"]
rag = ["dep:embedag-rag"]
oxirs-tdb = ["dep:embedag-oxirs"]

[dependencies]
embedag-core = { workspace = true, optional = true }
embedag-derive = { workspace = true, optional = true }
embedag-llm = { workspace = true, optional = true }
embedag-diesel = { workspace = true, optional = true }
embedag-rag = { workspace = true, optional = true }
embedag-oxirs = { workspace = true, optional = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
diesel = { workspace = true }
h3o = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
