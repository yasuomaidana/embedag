[package]
name = "embedag"
description = "Deterministic hybrid Graph-RAG, in-memory DAGs, mixed-modality encoding, relational persistence, and Turso / libSQL support."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["full"]
full = ["core", "derive", "llm", "diesel", "rag", "oxirs-tdb", "surrealdb", "neo4j", "turso", "turso-async", "matcher"]
core = ["dep:embedag-core"]
matcher = ["dep:embedag-matcher", "core"]
derive = ["dep:embedag-derive"]
llm = ["dep:embedag-llm"]
diesel = ["dep:embedag-diesel"]
turso = ["diesel", "embedag-diesel/turso"]
turso-async = ["turso", "embedag-diesel/turso-async"]
rag = ["dep:embedag-rag"]
oxirs-tdb = ["dep:embedag-oxirs"]
surrealdb = ["dep:embedag-surrealdb"]
neo4j = ["dep:embedag-neo4j"]

[dependencies]
embedag-core = { workspace = true, optional = true }
embedag-matcher = { workspace = true, optional = true }
embedag-derive = { workspace = true, optional = true }
embedag-llm = { workspace = true, optional = true }
embedag-diesel = { workspace = true, optional = true }
embedag-rag = { workspace = true, optional = true }
embedag-oxirs = { workspace = true, optional = true }
embedag-surrealdb = { workspace = true, optional = true }
embedag-neo4j = { workspace = true, optional = true }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
diesel = { workspace = true }
h3o = { workspace = true }
