# Licence policy: permissive licences, plus BUSL-1.1 from projects with a public repository.
#
# BUSL-1.1 is allowed only for projects whose source repository is public (SurrealDB is one). cargo-deny
# cannot see repository visibility, so `scripts/check-busl-public-repos.py` enforces that part: it fails
# when a BUSL-1.1 crate's repository is private. COOLJAPAN relicensed oxirag and oxillama to BUSL-1.1 and
# made their repositories private (2026-11), so both fail that check, and both are also banned below.

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BUSL-1.1",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "oxirag" },
    { crate = "oxillama" },
    { crate = "oxillama-runtime" },
    { crate = "oxibonsai" },
]

# surrealdb-* declare no licence field, only a LICENSE file, so each is clarified by that file's hash.
[[licenses.clarify]]
crate = "surrealdb"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

